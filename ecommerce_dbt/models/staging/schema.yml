version: 2

models:
  - name: stg_customers
    description: Cleaned customer seed; one row per customer.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: email
        data_tests:
          - not_null

  - name: stg_products
    description: Cleaned product catalog; prices and costs are in VND.
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: list_price
        data_tests:
          - not_null

  - name: stg_orders
    description: Cleaned order headers; one row per order.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: store_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'delivered', 'cancelled', 'returned']

  - name: stg_order_items
    description: Cleaned order lines; one row per order item.
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

  - name: stg_stores
    description: Cleaned store and sales-channel seed.
    columns:
      - name: store_id
        data_tests:
          - unique
          - not_null
      - name: sales_channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['online', 'retail']
