version: 2

models:
  - name: dim_customer
    description: Customer dimension; one row per customer.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: dim_product
    description: Product dimension with catalog pricing and list-price margin.
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: dim_store
    description: Store and sales-channel dimension.
    columns:
      - name: store_id
        data_tests:
          - unique
          - not_null

  - name: dim_date
    description: Calendar date dimension spanning all order dates.
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null
      - name: date_day
        data_tests:
          - unique
          - not_null
